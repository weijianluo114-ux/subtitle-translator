<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>字幕整行翻译</title>
</head>
<body>
  <header class="kt-header">
    <div class="kt-logo">译</div>
    <div class="kt-title" data-i18n="appTitle">字幕整行翻译</div>
    <button id="donate-btn" class="kt-donate-btn" title="Buy me a coffee (for school fee)">☕</button>
    <select id="lang-select" class="kt-lang-select" title="界面语言 / UI language">
      <option value="zh_CN">中文</option>
      <option value="en">English</option>
    </select>
  </header>

  <div id="donate-panel" class="kt-donate-panel kt-hidden">
    <div class="kt-donate-title">Buy me a coffee <span>(for school fee)</span></div>
    <div class="kt-donate-sub" data-i18n="donateSub">扫码请我喝杯咖啡，支持学费</div>
    <div class="kt-donate-imgs">
      <figure>
        <img src="assets/wechat.png" alt="WeChat Pay QR code">
        <figcaption>微信 WeChat</figcaption>
      </figure>
      <figure>
        <img src="assets/alipay.jpg" alt="Alipay QR code">
        <figcaption>支付宝 Alipay</figcaption>
      </figure>
    </div>
  </div>

  <nav class="kt-tabs">
    <button class="kt-tab active" data-tab="settings" data-i18n="tabSettings">设置</button>
    <button class="kt-tab" data-tab="appearance" data-i18n="tabAppearance">外观</button>
  </nav>

  <main>
    <!-- ================= 设置 ================= -->
    <section id="panel-settings" class="kt-panel">
      <div class="kt-group-title" data-i18n="groupTranslation">翻译</div>

      <label class="kt-row">
        <span data-i18n="translator">翻译引擎</span>
        <select id="translator">
          <option value="google">Google</option>
          <option value="bing">Bing</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="sourceLanguage">源语言</span>
        <select id="source-language"><option value="auto" data-i18n="autoDetect">自动检测</option></select>
      </label>

      <label class="kt-row">
        <span data-i18n="targetLanguage">目标语言</span>
        <select id="target-language"></select>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="sentenceTranslation">整句翻译</span>
        <span class="kt-switch"><input type="checkbox" id="sentence-translation"><i></i></span>
      </label>

      <div class="kt-group-title" data-i18n="groupBehavior">行为</div>

      <label class="kt-row kt-row-switch">
        <span data-i18n="autoPause">悬停时自动暂停视频</span>
        <span class="kt-switch"><input type="checkbox" id="auto-pause"><i></i></span>
      </label>

      <label class="kt-row">
        <span data-i18n="leftClickAction">左键点击单词</span>
        <select id="left-click-action">
          <option value="copy-translation" data-i18n="copyTranslation">复制译文</option>
          <option value="copy-original" data-i18n="copyOriginal">复制原文</option>
          <option value="nothing" data-i18n="doNothing">无动作</option>
        </select>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="alwaysMultiple">始终多选（不用按 Shift）</span>
        <span class="kt-switch"><input type="checkbox" id="always-multiple"><i></i></span>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="showNotifications">操作通知</span>
        <span class="kt-switch"><input type="checkbox" id="show-notifications"><i></i></span>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="debug">调试模式（开发用）</span>
        <span class="kt-switch"><input type="checkbox" id="debug"><i></i></span>
      </label>

      <div class="kt-actions">
        <button id="debug-download" class="kt-btn kt-btn-secondary" data-i18n="debugDownload">下载诊断</button>
        <div id="debug-status" class="kt-debug-status"></div>
      </div>

      <div class="kt-actions">
        <button id="reset-settings" class="kt-btn" data-i18n="resetSettings">重置设置</button>
      </div>
    </section>

    <!-- ================= 外观 ================= -->
    <section id="panel-appearance" class="kt-panel kt-hidden">
      <div class="kt-group-title" data-i18n="groupSubtitle">字幕</div>

      <label class="kt-row kt-row-switch">
        <span data-i18n="enabled">启用整行字幕</span>
        <span class="kt-switch"><input type="checkbox" id="enabled"><i></i></span>
      </label>

      <label class="kt-row">
        <span data-i18n="manualCaptions">手动字幕（创作者 CC）</span>
        <select id="manual-captions">
          <option value="rechunk" data-i18n="manualRechunk">重排为整行</option>
          <option value="keep" data-i18n="manualKeep">原样保留</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="targetLines">行数</span>
        <select id="target-lines">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="textSize">字号</span>
        <select id="text-size">
          <option value="small" data-i18n="sizeSmall">小</option>
          <option value="medium" data-i18n="sizeMedium">中</option>
          <option value="large" data-i18n="sizeLarge">大</option>
          <option value="xlarge" data-i18n="sizeXlarge">特大</option>
          <option value="xxlarge" data-i18n="sizeXxlarge">超大</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="font">字体</span>
        <select id="font">
          <option value="atkinson">Atkinson Hyperlegible</option>
          <option value="cascadia">Cascadia Code</option>
          <option value="noto">Noto Sans</option>
          <option value="average">Average Sans</option>
          <option value="roboto">Roboto</option>
          <option value="bona">Bona Nova</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="textColor">文字颜色</span>
        <select id="text-color">
          <option value="white" data-i18n="colorWhite">白</option>
          <option value="yellow" data-i18n="colorYellow">黄</option>
          <option value="green" data-i18n="colorGreen">绿</option>
          <option value="cyan" data-i18n="colorCyan">青</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="textOpacity">文字透明度</span>
        <select id="text-opacity">
          <option value="100">100%</option><option value="75">75%</option><option value="50">50%</option>
        </select>
      </label>

      <label class="kt-row">
        <span data-i18n="background">背景深浅</span>
        <select id="background">
          <option value="0">0%</option><option value="25">25%</option><option value="50">50%</option>
          <option value="75">75%</option><option value="100">100%</option>
        </select>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="allCaps">全大写</span>
        <span class="kt-switch"><input type="checkbox" id="all-caps"><i></i></span>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="textOutline">文字描边</span>
        <span class="kt-switch"><input type="checkbox" id="text-outline"><i></i></span>
      </label>

      <label class="kt-row kt-row-switch">
        <span data-i18n="textBold">加粗</span>
        <span class="kt-switch"><input type="checkbox" id="text-bold"><i></i></span>
      </label>

      <div class="kt-group-title" data-i18n="groupPosition">位置</div>

      <label class="kt-row">
        <span data-i18n="positionMode">位置模式</span>
        <select id="position-mode">
          <option value="preset" data-i18n="posPreset">预设 21 宫格</option>
          <option value="custom" data-i18n="posCustom">自定义滑块</option>
        </select>
      </label>

      <div id="position-grid" class="kt-position-grid">
        <button type="button" data-pos="left-top" title="左上"></button>
        <button type="button" data-pos="center-top" title="上"></button>
        <button type="button" data-pos="right-top" title="右上"></button>
        <button type="button" data-pos="left-high" title="左高"></button>
        <button type="button" data-pos="center-high" title="高"></button>
        <button type="button" data-pos="right-high" title="右高"></button>
        <button type="button" data-pos="left-highish" title="左中上"></button>
        <button type="button" data-pos="center-highish" title="中上"></button>
        <button type="button" data-pos="right-highish" title="右中上"></button>
        <button type="button" data-pos="left-middle" title="左中"></button>
        <button type="button" data-pos="center-middle" title="中间"></button>
        <button type="button" data-pos="right-middle" title="右中"></button>
        <button type="button" data-pos="left-lowish" title="左中下"></button>
        <button type="button" data-pos="center-lowish" title="中下"></button>
        <button type="button" data-pos="right-lowish" title="右中下"></button>
        <button type="button" data-pos="left-low" title="左低"></button>
        <button type="button" data-pos="center-low" title="低"></button>
        <button type="button" data-pos="right-low" title="右低"></button>
        <button type="button" data-pos="left-bottom" title="左下"></button>
        <button type="button" data-pos="center-bottom" title="底部"></button>
        <button type="button" data-pos="right-bottom" title="右下"></button>
      </div>

      <div id="custom-position" class="kt-hidden">
        <label class="kt-row kt-row-range">
          <span data-i18n="posX">水平位置（左 → 右）</span>
          <input type="range" id="pos-x" min="0" max="100" step="1">
        </label>
        <label class="kt-row kt-row-range">
          <span data-i18n="posY">垂直位置（上 → 下）</span>
          <input type="range" id="pos-y" min="0" max="100" step="1">
        </label>
      </div>

      <div class="kt-group-title" data-i18n="groupWidth">字幕宽度</div>

      <label class="kt-row">
        <span data-i18n="captionWidth">宽度模式</span>
        <select id="caption-width">
          <option value="auto" data-i18n="widthAuto">自动（随字号）</option>
          <option value="third">1/3</option>
          <option value="half">1/2</option>
          <option value="twothirds">2/3</option>
          <option value="custom" data-i18n="widthCustom">自定义</option>
        </select>
      </label>

      <label id="width-custom-row" class="kt-row kt-row-range kt-hidden">
        <span data-i18n="widthPercent">自定义宽度（屏宽 %）</span>
        <input type="range" id="width-percent" min="10" max="100" step="1">
      </label>

      <div class="kt-group-title" data-i18n="groupTooltip">翻译气泡</div>

      <label class="kt-row kt-row-switch">
        <span data-i18n="tooltipFollow">跟随字幕样式</span>
        <span class="kt-switch"><input type="checkbox" id="tooltip-follow"><i></i></span>
      </label>

      <div id="tooltip-custom" class="kt-hidden">
        <label class="kt-row kt-row-switch">
          <span data-i18n="ttBold">气泡文字加粗</span>
          <span class="kt-switch"><input type="checkbox" id="tooltip-bold"><i></i></span>
        </label>
        <label class="kt-row">
          <span data-i18n="ttFontFamily">气泡字体</span>
          <select id="tooltip-font-family"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttFontSize">气泡字号</span>
          <select id="tooltip-font-size"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttFontColor">气泡字色</span>
          <select id="tooltip-font-color"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttFontOpacity">气泡字透明度</span>
          <select id="tooltip-font-opacity"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttBgColor">气泡背景色</span>
          <select id="tooltip-bg-color"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttBgOpacity">气泡背景透明度</span>
          <select id="tooltip-bg-opacity"></select>
        </label>
        <label class="kt-row">
          <span data-i18n="ttEdge">气泡字符边缘</span>
          <select id="tooltip-edge"></select>
        </label>
      </div>

      <div class="kt-actions">
        <button id="reset-appearance" class="kt-btn" data-i18n="resetAppearance">重置外观</button>
      </div>
    </section>
  </main>

  <footer class="kt-footer"><span id="version">v0.1.0</span></footer>

  <script src="popup.js"></script>
</body>
</html>
